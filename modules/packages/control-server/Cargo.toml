[package]
name = "nix-control-server"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = { version = "0.16", features = ["derive"] }
axum = "0.8"
bytes = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
hmac = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "io-util"] }
url = "2"

[dev-dependencies]
similar-asserts = "2"
